[workspace]
members = [
    "crates/primitives",
    "crates/fs",
    "crates/ivc",
    "crates/frontends",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/privacy-scaling-explorations/sonobe/"
rust-version = "1.85.1"

[workspace.dependencies]
itertools = { version = "0.14.0" }
num-bigint = { version = "0.4.3" }
num-integer = { version = "0.1" }
num-traits = { version = "0.2" }
sha3 = { version = "0.10" }
rayon = { version = "1" }
thiserror = { version = "2.0.16" }
wasm-bindgen-test = { version = "0.3" }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1" }
hashbrown = { version = "0.17" }

# Noir frontend: depend on upstream noir-lang/noir's `acvm` (now on arkworks 0.6,
# exporting a generic `GenericFieldElement<F>`), pinned to a release tag. The 1.0
# beta line is not published to crates.io, so this is a git dependency.
acvm = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.22", default-features = false }

# Arkworks family
ark-crypto-primitives = { version = "0.6.0", default-features = false }
ark-ec = { version = "0.6.0", default-features = false }
ark-ff = { version = "0.6.0", default-features = false }
ark-groth16 = { version = "0.6.0", default-features = false }
ark-poly = { version = "0.6.0", default-features = false }
ark-r1cs-std = { version = "0.6.0", default-features = false }
ark-relations = { version = "0.6.0", default-features = false }
ark-serialize = { version = "0.6.0", default-features = false }
ark-snark = { version = "0.6.0", default-features = false }
ark-std = { version = "0.6.0", default-features = false }

# Ark curves
ark-bn254 = { version = "0.6.0", default-features = false }
ark-grumpkin = { version = "0.6.0", default-features = false }
ark-pallas = { version = "0.6.0", default-features = false }
ark-vesta = { version = "0.6.0", default-features = false }

# Local crates
sonobe-primitives = { path = "crates/primitives", default-features = false }
sonobe-fs = { path = "crates/fs", default-features = false }
sonobe-ivc = { path = "crates/ivc", default-features = false }
