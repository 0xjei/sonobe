[package]
name = "sonobe-frontends"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ark-ff = { workspace = true, features = ["asm"] }
ark-crypto-primitives = { workspace = true, features = ["prf", "constraints"] }
ark-r1cs-std = { workspace = true }
ark-relations = { workspace = true }
ark-std = { workspace = true, features = ["getrandom", "std"] }
acvm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

sonobe-primitives = { workspace = true }

[dev-dependencies]
ark-bn254 = { workspace = true, features = ["curve", "r1cs"] }
ark-grumpkin = { workspace = true, features = ["r1cs"] }
num-bigint = { workspace = true }
sonobe-fs = { workspace = true }
sonobe-ivc = { workspace = true }

[features]
default = []
parallel = [
    "sonobe-primitives/parallel",
    "sonobe-fs/parallel",
    "sonobe-ivc/parallel",
    "ark-crypto-primitives/parallel",
    "ark-ff/parallel",
    "ark-r1cs-std/parallel",
    "ark-relations/parallel",
    "ark-std/parallel",
]
